name: Workshop PR Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  workshop-on-pr-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run workshop on PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"

          mapfile -d '' changed_files < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed files in PR diff."
            exit 0
          fi

          sudo snap refresh lxd --channel=6/stable || sudo snap install lxd --channel=6/stable
          sudo snap install workshop --classic

          echo "Changed files in PR diff:"
          printf '%s\n' "${changed_files[@]}"

          combined_diff_file="pr.diff"
          : > "$combined_diff_file"
          matched_count=0

          for file in "${changed_files[@]}"; do
            case "$file" in
              *.py|*.txt) 
                git diff "$BASE_SHA" "$HEAD_SHA" -- "$file" >> "$combined_diff_file"
                matched_count=$((matched_count + 1))
                ;;
            esac
          done

          if [ "$matched_count" -eq 0 ]; then
            echo "No changed .py or .txt files in PR diff."
            exit 0
          fi

          echo "Combined diff file created: $combined_diff_file"

          workshop launch
          workshop exec workshop-doc-content-sync cat "$combined_diff_file"